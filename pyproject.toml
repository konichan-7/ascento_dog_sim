[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ascento-dog-sim"
version = "0.1.0"
description = "MuJoCo simulation and control foundations for an Ascento-style four-wheeled legged robot"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "matplotlib>=3.8,<4",
  "mujoco>=3.3,<4",
  "numpy>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
leg-kinematics = "ascento_dog.scripts.leg_kinematics:main"
vmc = "ascento_dog.scripts.vmc:main"

[tool.hatch.build.targets.wheel]
packages = ["ascento_dog"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
