<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">跨越二百毫米台阶的六阶段状态机</title>
  <desc id="desc">学术线稿风格的状态机。六个阶段依次为接近、前轮爬升、跨坐、后轮爬升、姿态恢复和完成；下方列出左右轮同时满足的转移条件与共同故障规则。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#111"/></marker>
    <style>
      .state{fill:#fff;stroke:#111;stroke-width:1.8}.flow{fill:none;stroke:#111;stroke-width:1.8;marker-end:url(#arrow)}.dash{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 6}.rule{stroke:#aaa;stroke-width:1}.head{font:600 17px 'Times New Roman','STIX Two Text',serif;fill:#111}.cn{font:16px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.math{font:italic 18px 'Times New Roman','STIX Two Text',serif;fill:#111}.smallmath{font:italic 15px 'Times New Roman','STIX Two Text',serif;fill:#111}.note{font:15px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.num{font:italic 17px 'Times New Roman','STIX Two Text',serif;fill:#111}
    </style>
  </defs>
  <rect width="1200" height="610" fill="#fff"/>

  <text x="40" y="39" class="math">H<tspan baseline-shift="sub" font-size="12">s</tspan>=200 mm</text>
  <text x="1160" y="39" text-anchor="end" class="note">VMC 力控 → 几何锁定与腿长伺服 → 台上姿态恢复</text>

  <!-- states -->
  <g>
    <rect x="30" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="47" y="100" class="num">1</text><text x="112" y="118" text-anchor="middle" class="head">APPROACH</text>
    <text x="112" y="151" text-anchor="middle" class="cn">四腿 VMC</text>
    <text x="112" y="178" text-anchor="middle" class="smallmath">h*=h<tspan baseline-shift="sub" font-size="11">stance</tspan>, 0.25 m/s</text>

    <rect x="225" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="242" y="100" class="num">2</text><text x="307" y="118" text-anchor="middle" class="head">FRONT_CLIMB</text>
    <text x="307" y="151" text-anchor="middle" class="cn">前轮摩擦爬升</text>
    <text x="307" y="178" text-anchor="middle" class="smallmath">f<tspan baseline-shift="sub" font-size="11">i,max</tspan>=70 N, i∈𝓕</text>

    <rect x="420" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="437" y="100" class="num">3</text><text x="502" y="118" text-anchor="middle" class="head">STRADDLE</text>
    <text x="502" y="151" text-anchor="middle" class="cn">前轮在台、后轮在地</text>
    <text x="502" y="178" text-anchor="middle" class="cn">低站姿推进</text>

    <rect x="615" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="632" y="100" class="num">4</text><text x="697" y="118" text-anchor="middle" class="head">REAR_CLIMB</text>
    <text x="697" y="151" text-anchor="middle" class="cn">前腿锁定、后腿收缩</text>
    <text x="697" y="178" text-anchor="middle" class="smallmath">dℓ*/dt=−0.16 m/s</text>

    <rect x="810" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="827" y="100" class="num">5</text><text x="892" y="118" text-anchor="middle" class="head">EXTEND</text>
    <text x="892" y="151" text-anchor="middle" class="cn">四轮停车</text>
    <text x="892" y="178" text-anchor="middle" class="cn">1.5 s 髋角插值</text>

    <rect x="1005" y="75" width="165" height="125" rx="3" class="state"/>
    <text x="1022" y="100" class="num">6</text><text x="1087" y="118" text-anchor="middle" class="head">DONE</text>
    <text x="1087" y="151" text-anchor="middle" class="cn">恢复四腿 VMC</text>
    <text x="1087" y="178" text-anchor="middle" class="smallmath">h*=h<tspan baseline-shift="sub" font-size="11">extend</tspan></text>
  </g>
  <path d="M195 137H225" class="flow"/><path d="M390 137H420" class="flow"/><path d="M585 137H615" class="flow"/>
  <path d="M780 137H810" class="flow"/><path d="M975 137H1005" class="flow"/>

  <!-- transition guards -->
  <line x1="30" y1="244" x2="1170" y2="244" class="rule"/>
  <text x="30" y="277" class="cn">转移判据（左右轮均满足）</text>

  <text x="45" y="320" class="smallmath">1 → 2</text>
  <text x="45" y="351" class="smallmath">x<tspan baseline-shift="sub" font-size="11">front</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">s</tspan>−R−m<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  <line x1="240" y1="300" x2="240" y2="383" class="rule"/>

  <text x="270" y="320" class="smallmath">2 → 3</text>
  <text x="270" y="351" class="smallmath">x<tspan baseline-shift="sub" font-size="11">front</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">s</tspan>+m<tspan baseline-shift="sub" font-size="11">e</tspan></text>
  <text x="270" y="378" class="smallmath">z<tspan baseline-shift="sub" font-size="11">front</tspan> ≥ H<tspan baseline-shift="sub" font-size="11">s</tspan>+R−m<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  <line x1="480" y1="300" x2="480" y2="383" class="rule"/>

  <text x="510" y="320" class="smallmath">3 → 4</text>
  <text x="510" y="351" class="smallmath">x<tspan baseline-shift="sub" font-size="11">rear</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">s</tspan>−R−m<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  <line x1="705" y1="300" x2="705" y2="383" class="rule"/>

  <text x="735" y="320" class="smallmath">4 → 5</text>
  <text x="735" y="351" class="smallmath">x<tspan baseline-shift="sub" font-size="11">rear</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">s</tspan>+m<tspan baseline-shift="sub" font-size="11">e</tspan></text>
  <text x="735" y="378" class="smallmath">z<tspan baseline-shift="sub" font-size="11">rear</tspan> ≥ H<tspan baseline-shift="sub" font-size="11">s</tspan>+R−m<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  <line x1="945" y1="300" x2="945" y2="383" class="rule"/>

  <text x="975" y="320" class="smallmath">5 → 6</text>
  <text x="975" y="351" class="smallmath">|h−h<tspan baseline-shift="sub" font-size="11">extend</tspan>|≤0.02 m</text>
  <text x="975" y="378" class="smallmath">|ϕ<tspan baseline-shift="sub" font-size="11">B</tspan>|, |ϑ<tspan baseline-shift="sub" font-size="11">B</tspan>|≤1°</text>

  <!-- state-specific notes -->
  <line x1="30" y1="424" x2="1170" y2="424" class="rule"/>
  <text x="30" y="458" class="cn">关键处理</text>
  <text x="45" y="493" class="note">FRONT_CLIMB：降低前腿支持力上限，保持姿态 VMC，利用轮—立面滚动摩擦。</text>
  <text x="45" y="529" class="note">REAR_CLIMB：后腿目标按有效腿长单调收缩，避免世界高度反解与 pitch 耦合形成正反馈。</text>
  <text x="45" y="565" class="note">EXTEND：轮速归零，关节角平滑插值并叠加解析重力前馈。</text>
  <path d="M30 590H1170" class="dash"/>
  <text x="600" y="607" text-anchor="middle" class="note">任一阶段超时即 failed；腿集合错误或 Δt≤0 直接拒绝；当前无在线接触估计与失败撤退。</text>
</svg>
