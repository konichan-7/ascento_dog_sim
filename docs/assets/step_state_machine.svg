<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="520" viewBox="0 0 1450 520" role="img" aria-labelledby="title desc">
  <title id="title">150 毫米上台阶状态机</title>
  <desc id="desc">从接近、前轮爬升、跨坐、后轮爬升、同步伸展到完成的六阶段状态机，并标注每次转移的轮心位置与超时条件。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#596775"/></marker><style>.h{font:700 18px Arial,sans-serif;fill:#18222c}.s{font:14px Arial,sans-serif;fill:#374151}.b{stroke-width:2.5;rx:16}.l{stroke:#596775;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1450" height="520" fill="#fbfcfe"/><text x="725" y="42" text-anchor="middle" class="h">跨越 150 mm 台阶：混合力控 / 位置伺服状态机</text>
  <rect x="25" y="165" width="190" height="145" class="b" fill="#e8f2fb" stroke="#397bb5"/><text x="120" y="203" text-anchor="middle" class="h">APPROACH</text><text x="120" y="236" text-anchor="middle" class="s">全腿 VMC 力控</text><text x="120" y="263" text-anchor="middle" class="s">低站姿、水平前进</text><text x="120" y="290" text-anchor="middle" class="s">四轮同速</text>
  <rect x="265" y="145" width="200" height="185" class="b" fill="#fff3d8" stroke="#d69b2d"/><text x="365" y="183" text-anchor="middle" class="h">FRONT_CLIMB</text><text x="365" y="216" text-anchor="middle" class="s">全腿仍为 VMC 力控</text><text x="365" y="243" text-anchor="middle" class="s">前腿力帽 70 N</text><text x="365" y="270" text-anchor="middle" class="s">轮速 + 后轴顶压</text><text x="365" y="297" text-anchor="middle" class="s">立面滚动摩擦抬前轮</text>
  <rect x="515" y="165" width="190" height="145" class="b" fill="#e9f7ef" stroke="#3d9663"/><text x="610" y="203" text-anchor="middle" class="h">STRADDLE</text><text x="610" y="236" text-anchor="middle" class="s">全腿 VMC 力控</text><text x="610" y="263" text-anchor="middle" class="s">前轮在台、后轮在地</text><text x="610" y="290" text-anchor="middle" class="s">保持低站姿推进</text>
  <rect x="755" y="135" width="215" height="205" class="b" fill="#fcecea" stroke="#cf5b50"/><text x="862" y="173" text-anchor="middle" class="h">REAR_CLIMB</text><text x="862" y="206" text-anchor="middle" class="s">四腿切换位置伺服</text><text x="862" y="233" text-anchor="middle" class="s">前腿锁 qmax（最短）</text><text x="862" y="260" text-anchor="middle" class="s">后腿按 0.08 m/s 收缩</text><text x="862" y="287" text-anchor="middle" class="s">前轮低顶压、后轮自转</text><text x="862" y="314" text-anchor="middle" class="s">拖拽后轮越过立面</text>
  <rect x="1020" y="165" width="190" height="145" class="b" fill="#f3eafb" stroke="#8a5bb5"/><text x="1115" y="203" text-anchor="middle" class="h">EXTEND</text><text x="1115" y="236" text-anchor="middle" class="s">恢复全腿 VMC</text><text x="1115" y="263" text-anchor="middle" class="s">1.5 s 高度斜坡</text><text x="1115" y="290" text-anchor="middle" class="s">四腿同步伸展</text>
  <rect x="1260" y="165" width="165" height="145" class="b" fill="#eef2f6" stroke="#596775"/><text x="1342" y="203" text-anchor="middle" class="h">DONE</text><text x="1342" y="236" text-anchor="middle" class="s">台上标称高度</text><text x="1342" y="263" text-anchor="middle" class="s">roll/pitch = 0</text><text x="1342" y="290" text-anchor="middle" class="s">轮速归零并保持</text>
  <path d="M215 237 H265" class="l"/><path d="M465 237 H515" class="l"/><path d="M705 237 H755" class="l"/><path d="M970 237 H1020" class="l"/><path d="M1210 237 H1260" class="l"/>
  <text x="240" y="112" text-anchor="middle" class="s">前轮接近立面</text><text x="490" y="372" text-anchor="middle" class="s">前轮 x 越过边缘且 z 到达台面</text><text x="730" y="112" text-anchor="middle" class="s">后轮接近立面</text><text x="995" y="372" text-anchor="middle" class="s">后轮 x 越过边缘且 z 到达台面</text><text x="1235" y="112" text-anchor="middle" class="s">斜坡结束且高度误差 ≤ 0.02 m</text>
  <rect x="225" y="420" width="1000" height="65" rx="12" fill="#fff8e8" stroke="#d69b2b" stroke-width="2"/><text x="725" y="447" text-anchor="middle" class="h">共同故障规则</text><text x="725" y="473" text-anchor="middle" class="s">任一阶段超过独立超时即 failed；腿名缺失或 dt≤0 直接拒绝；当前无统一观测校验、接触估计、撤退与在线重规划。</text>
</svg>
