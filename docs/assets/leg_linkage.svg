<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc">
  <title id="title">单腿闭环连杆坐标与符号</title>
  <desc id="desc">学术线稿风格的单腿闭环机构图。标出 A、B、C、D、E、五条杆长、主动角、固定角、轮心坐标和装配支路；x 轴红色、y 轴绿色、z 轴蓝色并带箭头。</desc>
  <defs>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#e31a1c"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00a020"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#0671ce"/></marker>
    <marker id="black-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#111"/></marker>
    <style>
      .link{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round}.wheel{fill:#f2f2f2;stroke:#111;stroke-width:2.4}.joint{fill:#fff;stroke:#111;stroke-width:2.5}.fixed{fill:#111}.axis-r{stroke:#e31a1c;stroke-width:4;marker-end:url(#red-arrow)}.axis-g{stroke:#00a020;stroke-width:4;marker-end:url(#green-arrow)}.axis-b{stroke:#0671ce;stroke-width:4;marker-end:url(#blue-arrow)}.guide{fill:none;stroke:#666;stroke-width:1.4;stroke-dasharray:7 6}.dim{fill:none;stroke:#111;stroke-width:1.5;marker-end:url(#black-arrow)}.arc{fill:none;stroke:#111;stroke-width:1.8;marker-end:url(#black-arrow)}.leader{fill:none;stroke:#111;stroke-width:1.3}.math{font:italic 26px 'Times New Roman','STIX Two Text',serif;fill:#111}.smallmath{font:italic 21px 'Times New Roman','STIX Two Text',serif;fill:#111}.note{font:17px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.small{font:15px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}
    </style>
  </defs>
  <rect width="1050" height="650" fill="#fff"/>

  <!-- coordinate frame at A -->
  <circle cx="220" cy="225" r="6" class="fixed"/>
  <line x1="220" y1="225" x2="620" y2="225" class="axis-r"/>
  <line x1="220" y1="225" x2="128" y2="294" class="axis-g"/>
  <line x1="220" y1="225" x2="220" y2="72" class="axis-b"/>
  <text x="629" y="234" class="math" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="17">L</tspan></text>
  <text x="83" y="314" class="math" fill="#00a020">y<tspan baseline-shift="sub" font-size="17">L</tspan></text>
  <text x="232" y="83" class="math" fill="#0671ce">z<tspan baseline-shift="sub" font-size="17">L</tspan></text>

  <!-- closed linkage at q=-40 deg -->
  <line x1="220" y1="225" x2="327" y2="118" class="link"/>
  <line x1="220" y1="225" x2="506" y2="409" class="link"/>
  <line x1="327" y1="118" x2="595" y2="357" class="link"/>
  <line x1="506" y1="409" x2="595" y2="357" class="link"/>
  <line x1="506" y1="409" x2="237" y2="566" class="link"/>

  <circle cx="220" cy="225" r="10" class="fixed"/>
  <circle cx="327" cy="118" r="9" class="joint"/>
  <circle cx="595" cy="357" r="9" class="joint"/>
  <circle cx="506" cy="409" r="9" class="joint"/>
  <circle cx="237" cy="566" r="10" class="joint"/>
  <circle cx="237" cy="566" r="38" class="wheel"/>
  <circle cx="237" cy="566" r="9" class="joint"/>

  <!-- point labels with leaders -->
  <path d="M211 214L176 180" class="leader"/><text x="154" y="177" class="math">A</text>
  <path d="M321 109L300 83" class="leader"/><text x="280" y="79" class="math">B</text>
  <path d="M603 350L631 331" class="leader"/><text x="638" y="333" class="math">C</text>
  <path d="M514 416L542 442" class="leader"/><text x="548" y="459" class="math">D</text>
  <path d="M228 575L185 603" class="leader"/><text x="164" y="620" class="math">E</text>

  <!-- link-length labels -->
  <text x="248" y="151" class="smallmath">L<tspan baseline-shift="sub" font-size="14">4</tspan>=|AB|</text>
  <text x="334" y="331" class="smallmath">L<tspan baseline-shift="sub" font-size="14">2</tspan>=|AD|</text>
  <text x="447" y="185" class="smallmath">L<tspan baseline-shift="sub" font-size="14">3</tspan>=|BC|</text>
  <text x="547" y="402" class="smallmath">L<tspan baseline-shift="sub" font-size="14">23</tspan>=|CD|</text>
  <text x="335" y="521" class="smallmath">L<tspan baseline-shift="sub" font-size="14">1</tspan>=|DE|</text>

  <!-- angles -->
  <path d="M280 225A60 60 0 0 0 262 183" class="arc"/>
  <text x="280" y="205" class="smallmath">γ=45°</text>
  <path d="M306 225A86 86 0 0 1 292 272" class="arc"/>
  <text x="306" y="274" class="math">q</text>

  <!-- wheel-center coordinates and effective length -->
  <line x1="237" y1="566" x2="237" y2="225" class="guide"/>
  <line x1="220" y1="225" x2="220" y2="566" class="guide"/>
  <line x1="220" y1="566" x2="237" y2="566" class="guide"/>
  <text x="184" y="399" class="smallmath" fill="#0671ce">E<tspan baseline-shift="sub" font-size="14">z</tspan></text>
  <text x="221" y="607" class="smallmath" fill="#e31a1c">E<tspan baseline-shift="sub" font-size="14">x</tspan></text>
  <line x1="221" y1="228" x2="236" y2="548" class="dim"/>
  <text x="256" y="466" class="smallmath">ℓ(q)=‖AE‖</text>

  <!-- concise definitions -->
  <line x1="710" y1="86" x2="710" y2="572" stroke="#aaa" stroke-width="1"/>
  <text x="752" y="125" class="math">A=(0,0)</text>
  <text x="752" y="174" class="math">E(q)=[E<tspan baseline-shift="sub" font-size="17">x</tspan>(q),E<tspan baseline-shift="sub" font-size="17">z</tspan>(q)]ᵀ</text>
  <text x="752" y="231" class="smallmath">L<tspan baseline-shift="sub" font-size="14">1</tspan>=0.23500 m</text>
  <text x="752" y="266" class="smallmath">L<tspan baseline-shift="sub" font-size="14">2</tspan>=0.23800 m</text>
  <text x="752" y="301" class="smallmath">L<tspan baseline-shift="sub" font-size="14">3</tspan>=0.24400 m</text>
  <text x="752" y="336" class="smallmath">L<tspan baseline-shift="sub" font-size="14">4</tspan>=0.10889 m</text>
  <text x="752" y="371" class="smallmath">L<tspan baseline-shift="sub" font-size="14">23</tspan>=0.05700 m</text>
  <text x="752" y="426" class="smallmath">−65° ≤ q ≤ −15°</text>
  <text x="752" y="478" class="smallmath">C,D,E collinear</text>
  <text x="752" y="522" class="smallmath">(D−B)×(C−D)&gt;0</text>
  <text x="752" y="565" class="note">允许的装配支路</text>
</svg>
