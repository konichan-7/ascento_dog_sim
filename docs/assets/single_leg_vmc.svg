<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">单腿 VMC 的虚拟力、虚功与力矩映射</title>
  <desc id="desc">学术线稿风格。左侧在闭环腿上标出主动关节力矩、轮心虚拟力和相容虚位移；右侧给出解析雅可比、虚功关系、力到力矩以及力矩到最小范数虚拟力的解析映射。</desc>
  <defs>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#e31a1c"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00a020"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#0671ce"/></marker>
    <marker id="black-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#111"/></marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#666"/></marker>
    <style>
      .link{fill:none;stroke:#111;stroke-width:3.5;stroke-linecap:round}.wheel{fill:#f2f2f2;stroke:#111;stroke-width:2.3}.joint{fill:#fff;stroke:#111;stroke-width:2.3}.fixed{fill:#111}.axis-r{stroke:#e31a1c;stroke-width:3.8;marker-end:url(#red-arrow)}.axis-g{stroke:#00a020;stroke-width:3.8;marker-end:url(#green-arrow)}.axis-b{stroke:#0671ce;stroke-width:3.8;marker-end:url(#blue-arrow)}.force{fill:none;stroke:#111;stroke-width:4;marker-end:url(#black-arrow)}.motion{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#gray-arrow)}.arrow{fill:none;stroke:#111;stroke-width:1.8;marker-end:url(#black-arrow)}.rule{stroke:#aaa;stroke-width:1}.math{font:italic 25px 'Times New Roman','STIX Two Text',serif;fill:#111}.eq{font:italic 23px 'Times New Roman','STIX Two Text',serif;fill:#111}.smallmath{font:italic 19px 'Times New Roman','STIX Two Text',serif;fill:#111}.head{font:600 18px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.note{font:16px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>

  <!-- Geometry rendered from DEFAULT_GEOMETRY at q_nominal; x-z plane. -->
<line x1="200.0000" y1="190.0000" x2="500.0000" y2="190.0000" class="axis-r"/>
<line x1="200.0000" y1="190.0000" x2="200.0000" y2="55.0000" class="axis-b"/>
<text x="506" y="198" class="math">x<tspan baseline-shift="sub" font-size="16">L</tspan></text>
<text x="211" y="67" class="math">z<tspan baseline-shift="sub" font-size="16">L</tspan></text>
<circle cx="121" cy="244" r="10" fill="white" stroke="#00a020" stroke-width="2"/>
<path d="M115 238L127 250M115 250L127 238" stroke="#00a020" stroke-width="2"/>
<text x="79" y="283" class="smallmath">+y_L 入纸面</text>
<line x1="200.0000" y1="190.0000" x2="280.8467" y2="109.1533" class="link"/>
<line x1="200.0000" y1="190.0000" x2="391.4345" y2="350.6326" class="link"/>
<line x1="280.8467" y1="109.1533" x2="437.2244" y2="312.0929" class="link"/>
<line x1="437.2244" y1="312.0929" x2="202.6518" y2="509.5246" class="link"/>
<circle cx="202.6518" cy="509.5246" r="68.25" class="wheel"/>
<circle cx="200.0000" cy="190.0000" r="7" class="fixed"/>
<text x="173.0000" y="175.0000" class="math">A</text>
<circle cx="280.8467" cy="109.1533" r="7" class="joint"/>
<text x="288.8467" y="94.1533" class="math">B</text>
<circle cx="437.2244" cy="312.0929" r="7" class="joint"/>
<text x="449.2244" y="304.0929" class="math">C</text>
<circle cx="391.4345" cy="350.6326" r="7" class="joint"/>
<text x="403.4345" y="370.6326" class="math">D</text>
<circle cx="202.6518" cy="509.5246" r="7" class="joint"/>
<text x="172.6518" y="517.5246" class="math">E</text>
<path d="M258 190A58 58 0 0 1 244.43 227.28" class="arrow"/>
<text x="268" y="229" class="smallmath">q = −40°</text>
<path d="M143 155A67 67 0 0 0 154 238" class="arrow"/>
<text x="75" y="159" class="smallmath">τ &gt; 0</text>
<line x1="202.6518" y1="509.5246" x2="332.6518" y2="384.5246" class="force"/>
<text x="340.6518" y="384.5246" class="math">F<tspan baseline-shift="sub" font-size="16">E</tspan><tspan baseline-shift="super" font-size="16">v</tspan></text>
<line x1="202.6518" y1="509.5246" x2="207.7046" y2="409.5246" class="motion"/>
<text x="45" y="404" class="smallmath">δE=J_E δq</text>
<text x="65" y="615" class="note">一个主动自由度只决定轨迹切向虚功</text>

  <!-- analytical derivation -->
  <line x1="575" y1="48" x2="575" y2="608" class="rule"/>
  <text x="620" y="78" class="head">闭环约束的微分运动</text>
  <text x="620" y="118" class="eq">g<tspan baseline-shift="sub" font-size="15">1</tspan>=0,  g<tspan baseline-shift="sub" font-size="15">2</tspan>=0</text>
  <path d="M785 110L846 110" class="arrow"/>
  <text x="857" y="118" class="smallmath">J<tspan baseline-shift="sub" font-size="15">E</tspan>=∂E/∂q=[J<tspan baseline-shift="sub" font-size="15">x</tspan>,J<tspan baseline-shift="sub" font-size="15">z</tspan>]ᵀ</text>

  <line x1="620" y1="151" x2="1148" y2="151" class="rule"/>
  <text x="620" y="188" class="head">虚功相等</text>
  <text x="620" y="229" class="eq">δ𝒲<tspan baseline-shift="sub" font-size="15">act</tspan>=τδq=(F<tspan baseline-shift="sub" font-size="15">E</tspan><tspan baseline-shift="super" font-size="15">v</tspan>)ᵀδE,　δE=J<tspan baseline-shift="sub" font-size="15">E</tspan>δq</text>
  <path d="M822 250L943 250" class="arrow"/>
  <text x="753" y="290" class="math">τ=J<tspan baseline-shift="sub" font-size="16">E</tspan>ᵀF<tspan baseline-shift="sub" font-size="16">E</tspan><tspan baseline-shift="super" font-size="16">v</tspan>=J<tspan baseline-shift="sub" font-size="16">x</tspan>F<tspan baseline-shift="sub" font-size="16">x</tspan><tspan baseline-shift="super" font-size="16">v</tspan>+J<tspan baseline-shift="sub" font-size="16">z</tspan>F<tspan baseline-shift="sub" font-size="16">z</tspan><tspan baseline-shift="super" font-size="16">v</tspan></text>

  <line x1="620" y1="327" x2="1148" y2="327" class="rule"/>
  <text x="620" y="364" class="head">主动力矩的等效虚拟力</text>
  <text x="620" y="409" class="eq">F<tspan baseline-shift="sub" font-size="15">E</tspan><tspan baseline-shift="super" font-size="15">eq</tspan>=</text>
  <text x="682" y="392" class="smallmath">J<tspan baseline-shift="sub" font-size="13">E</tspan></text>
  <line x1="674" y1="399" x2="729" y2="399" class="rule"/>
  <text x="670" y="421" class="smallmath">J<tspan baseline-shift="sub" font-size="13">E</tspan>ᵀJ<tspan baseline-shift="sub" font-size="13">E</tspan></text>
  <text x="738" y="409" class="eq">τ　(minimum-norm)</text>
  <text x="620" y="454" class="smallmath">F<tspan baseline-shift="sub" font-size="13">E</tspan><tspan baseline-shift="super" font-size="13">v</tspan>=F<tspan baseline-shift="sub" font-size="13">E</tspan><tspan baseline-shift="super" font-size="13">eq</tspan>+α[−J<tspan baseline-shift="sub" font-size="13">z</tspan>,J<tspan baseline-shift="sub" font-size="13">x</tspan>]ᵀ</text>
  <text x="620" y="486" class="note">法向零空间力不产生主动关节虚功，不能由单个 τ 唯一确定。</text>

  <line x1="620" y1="520" x2="1148" y2="520" class="rule"/>
  <text x="620" y="558" class="head">水平机体：竖直支持力的静力平衡</text>
  <text x="620" y="600" class="math">τ=−J<tspan baseline-shift="sub" font-size="16">z</tspan>f　⇔　f=−τ/J<tspan baseline-shift="sub" font-size="16">z</tspan>,　J<tspan baseline-shift="sub" font-size="16">z</tspan>≠0</text>
</svg>
