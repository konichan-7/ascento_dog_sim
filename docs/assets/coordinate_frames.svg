<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">世界系、机体系与四腿安装方向的二维俯视图</title>
  <desc id="desc">严格二维俯视的学术线稿。x 轴红色、y 轴绿色并带正方向箭头；z 轴蓝色，以朝向观察者的圆点箭头表示垂直纸面向外。标出四个髋点、轮子、腿名以及四条腿同向的局部 x 轴。</desc>
  <defs>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8.5,4 L0,8 Z" fill="#e31a1c"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8.5,4 L0,8 Z" fill="#00a020"/>
    </marker>
    <marker id="black-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,3.5 L0,7 Z" fill="#111"/>
    </marker>
    <style>
      .body{fill:#fff;stroke:#111;stroke-width:2.6}.centerline{fill:none;stroke:#aaa;stroke-width:1.2;stroke-dasharray:8 7}.wheel{fill:#f2f2f2;stroke:#111;stroke-width:2.2}.tireline{stroke:#888;stroke-width:1.2}.mount{fill:#fff;stroke:#111;stroke-width:2.2}.leader{fill:none;stroke:#444;stroke-width:1.35}.axis-r{stroke:#e31a1c;stroke-width:3.8;marker-end:url(#red-arrow)}.axis-g{stroke:#00a020;stroke-width:3.8;marker-end:url(#green-arrow)}.local-r{stroke:#e31a1c;stroke-width:2.7;marker-end:url(#red-arrow)}.direction{stroke:#111;stroke-width:1.8;marker-end:url(#black-arrow)}.rule{stroke:#bbb;stroke-width:1}.math{font:italic 27px 'Times New Roman','STIX Two Text',serif}.smallmath{font:italic 20px 'Times New Roman','STIX Two Text',serif}.note{font:17px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.tiny{font:15px 'Songti SC','Noto Serif CJK SC',serif;fill:#333}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>

  <!-- World frame: strict plan view. The circle-dot is an arrow viewed head-on. -->
  <line x1="128" y1="485" x2="287" y2="485" class="axis-r"/>
  <line x1="128" y1="485" x2="128" y2="326" class="axis-g"/>
  <circle cx="128" cy="485" r="13" fill="#fff" stroke="#0671ce" stroke-width="3"/>
  <circle cx="128" cy="485" r="4.5" fill="#0671ce"/>
  <text x="294" y="494" class="math" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="17">W</tspan></text>
  <text x="139" y="326" class="math" fill="#00a020">y<tspan baseline-shift="sub" font-size="17">W</tspan></text>
  <text x="78" y="525" class="math" fill="#0671ce">z<tspan baseline-shift="sub" font-size="17">W</tspan></text>
  <text x="101" y="555" class="smallmath">W</text>
  <text x="64" y="580" class="tiny">⊙：正向箭头垂直纸面向外</text>

  <line x1="352" y1="65" x2="352" y2="585" class="rule"/>

  <!-- Chassis and wheels in a true top view. +x_B points to the vehicle front. -->
  <rect x="475" y="160" width="470" height="320" rx="3" class="body"/>
  <line x1="475" y1="320" x2="945" y2="320" class="centerline"/>
  <line x1="710" y1="160" x2="710" y2="480" class="centerline"/>

  <!-- rear-left, front-left, rear-right, front-right wheels -->
  <rect x="510" y="119" width="96" height="27" rx="9" class="wheel"/>
  <line x1="532" y1="120" x2="532" y2="145" class="tireline"/><line x1="584" y1="120" x2="584" y2="145" class="tireline"/>
  <rect x="814" y="119" width="96" height="27" rx="9" class="wheel"/>
  <line x1="836" y1="120" x2="836" y2="145" class="tireline"/><line x1="888" y1="120" x2="888" y2="145" class="tireline"/>
  <rect x="510" y="494" width="96" height="27" rx="9" class="wheel"/>
  <line x1="532" y1="495" x2="532" y2="520" class="tireline"/><line x1="584" y1="495" x2="584" y2="520" class="tireline"/>
  <rect x="814" y="494" width="96" height="27" rx="9" class="wheel"/>
  <line x1="836" y1="495" x2="836" y2="520" class="tireline"/><line x1="888" y1="495" x2="888" y2="520" class="tireline"/>

  <!-- hip-to-wheel projections -->
  <line x1="558" y1="160" x2="558" y2="146" class="leader"/><line x1="862" y1="160" x2="862" y2="146" class="leader"/>
  <line x1="558" y1="480" x2="558" y2="494" class="leader"/><line x1="862" y1="480" x2="862" y2="494" class="leader"/>

  <!-- four hip mounts -->
  <circle cx="558" cy="160" r="6.5" class="mount"/><circle cx="862" cy="160" r="6.5" class="mount"/>
  <circle cx="558" cy="480" r="6.5" class="mount"/><circle cx="862" cy="480" r="6.5" class="mount"/>

  <!-- all four local +x_L axes point toward -x_B and carry arrowheads -->
  <line x1="558" y1="160" x2="493" y2="160" class="local-r"/>
  <line x1="862" y1="160" x2="797" y2="160" class="local-r"/>
  <line x1="558" y1="480" x2="493" y2="480" class="local-r"/>
  <line x1="862" y1="480" x2="797" y2="480" class="local-r"/>
  <text x="493" y="186" class="smallmath" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="13">L,RL</tspan></text>
  <text x="797" y="186" class="smallmath" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="13">L,FL</tspan></text>
  <text x="493" y="470" class="smallmath" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="13">L,RR</tspan></text>
  <text x="797" y="470" class="smallmath" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="13">L,FR</tspan></text>

  <!-- mount labels, kept outside the mechanism -->
  <path d="M558 153L536 103" class="leader"/><text x="481" y="97" class="smallmath">A<tspan baseline-shift="sub" font-size="13">RL</tspan></text>
  <path d="M862 153L884 103" class="leader"/><text x="891" y="97" class="smallmath">A<tspan baseline-shift="sub" font-size="13">FL</tspan></text>
  <path d="M558 487L536 541" class="leader"/><text x="481" y="565" class="smallmath">A<tspan baseline-shift="sub" font-size="13">RR</tspan></text>
  <path d="M862 487L884 541" class="leader"/><text x="891" y="565" class="smallmath">A<tspan baseline-shift="sub" font-size="13">FR</tspan></text>

  <!-- body frame at the chassis reference point -->
  <line x1="710" y1="320" x2="910" y2="320" class="axis-r"/>
  <line x1="710" y1="320" x2="710" y2="188" class="axis-g"/>
  <circle cx="710" cy="320" r="13" fill="#fff" stroke="#0671ce" stroke-width="3"/>
  <circle cx="710" cy="320" r="4.5" fill="#0671ce"/>
  <text x="915" y="346" class="math" fill="#e31a1c">x<tspan baseline-shift="sub" font-size="17">B</tspan></text>
  <text x="722" y="207" class="math" fill="#00a020">y<tspan baseline-shift="sub" font-size="17">B</tspan></text>
  <text x="667" y="358" class="math" fill="#0671ce">z<tspan baseline-shift="sub" font-size="17">B</tspan></text>

  <!-- orientation annotations -->
  <line x1="956" y1="320" x2="1028" y2="320" class="direction"/>
  <text x="966" y="303" class="note">前方</text>
  <text x="965" y="181" class="note">左侧</text>
  <text x="965" y="472" class="note">右侧</text>

  <text x="452" y="611" class="note">二维俯视：</text>
  <text x="548" y="611" class="tiny"><tspan>+x</tspan><tspan baseline-shift="sub" font-size="11">L,i</tspan> ∥ <tspan>−x</tspan><tspan baseline-shift="sub" font-size="11">B</tspan>；四条腿同向安装，前后腿不镜像</text>
</svg>
