<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="680" viewBox="0 0 1350 680" role="img" aria-labelledby="title desc">
  <title id="title">四轮足机器人 VMC 闭环框图</title>
  <desc id="desc">学术论文线稿风格的控制框图，包括底盘高度 PID、重力前馈、roll/pitch 姿态 PD、支持力分配、解析雅可比转置映射、执行器限幅、MuJoCo 或实机以及状态反馈。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#111"/></marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:1.7}.sum{fill:#fff;stroke:#111;stroke-width:1.7}.flow{fill:none;stroke:#111;stroke-width:1.8;marker-end:url(#arrow)}.feedback{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:7 6;marker-end:url(#arrow)}.rule{stroke:#aaa;stroke-width:1}.head{font:600 17px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.note{font:14px 'Songti SC','Noto Serif CJK SC',serif;fill:#111}.math{font:italic 18px 'Times New Roman','STIX Two Text',serif;fill:#111}.smallmath{font:italic 15px 'Times New Roman','STIX Two Text',serif;fill:#111}
    </style>
  </defs>
  <rect width="1350" height="680" fill="#fff"/>

  <!-- height and attitude controllers -->
  <rect x="35" y="55" width="195" height="105" class="box"/>
  <text x="132" y="84" text-anchor="middle" class="head">底盘高度 PID</text>
  <text x="132" y="113" text-anchor="middle" class="math">e<tspan baseline-shift="sub" font-size="12">h</tspan>=h*−h</text>
  <text x="132" y="141" text-anchor="middle" class="smallmath">F<tspan baseline-shift="sub" font-size="11">PID</tspan>=K<tspan baseline-shift="sub" font-size="11">ph</tspan>e<tspan baseline-shift="sub" font-size="11">h</tspan>+K<tspan baseline-shift="sub" font-size="11">ih</tspan>I<tspan baseline-shift="sub" font-size="11">h</tspan>−K<tspan baseline-shift="sub" font-size="11">dh</tspan>ḣ</text>

  <rect x="35" y="210" width="195" height="85" class="box"/>
  <text x="132" y="239" text-anchor="middle" class="head">重力前馈</text>
  <text x="132" y="270" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="12">g</tspan>=Mg</text>

  <rect x="35" y="345" width="195" height="120" class="box"/>
  <text x="132" y="374" text-anchor="middle" class="head">roll / pitch PD</text>
  <text x="132" y="405" text-anchor="middle" class="smallmath">τ<tspan baseline-shift="sub" font-size="11">x</tspan>*=−K<tspan baseline-shift="sub" font-size="11">pϕ</tspan>ϕ<tspan baseline-shift="sub" font-size="11">B</tspan>−K<tspan baseline-shift="sub" font-size="11">dϕ</tspan>ω<tspan baseline-shift="sub" font-size="11">x</tspan></text>
  <text x="132" y="435" text-anchor="middle" class="smallmath">τ<tspan baseline-shift="sub" font-size="11">y</tspan>*=−K<tspan baseline-shift="sub" font-size="11">pϑ</tspan>ϑ<tspan baseline-shift="sub" font-size="11">B</tspan>−K<tspan baseline-shift="sub" font-size="11">dϑ</tspan>ω<tspan baseline-shift="sub" font-size="11">y</tspan></text>

  <!-- wrench assembly -->
  <circle cx="300" cy="245" r="18" class="sum"/>
  <text x="300" y="251" text-anchor="middle" class="math">Σ</text>
  <path d="M230 108H270V227H282" class="flow"/>
  <path d="M230 252H282" class="flow"/>
  <path d="M230 405H270V263H282" class="flow"/>
  <text x="327" y="220" class="smallmath">F<tspan baseline-shift="sub" font-size="11">z</tspan>*=max(0,F<tspan baseline-shift="sub" font-size="11">g</tspan>+F<tspan baseline-shift="sub" font-size="11">PID</tspan>)</text>
  <text x="327" y="256" class="smallmath">w*=[F<tspan baseline-shift="sub" font-size="11">z</tspan>*,τ<tspan baseline-shift="sub" font-size="11">x</tspan>*,τ<tspan baseline-shift="sub" font-size="11">y</tspan>*]ᵀ</text>

  <!-- geometry -->
  <rect x="300" y="355" width="205" height="110" class="box"/>
  <text x="402" y="384" text-anchor="middle" class="head">实时几何</text>
  <text x="402" y="415" text-anchor="middle" class="smallmath">E<tspan baseline-shift="sub" font-size="11">i</tspan>=FK(q<tspan baseline-shift="sub" font-size="11">i</tspan>),　J<tspan baseline-shift="sub" font-size="11">E,i</tspan>(q<tspan baseline-shift="sub" font-size="11">i</tspan>)</text>
  <text x="402" y="443" text-anchor="middle" class="smallmath">r<tspan baseline-shift="sub" font-size="11">i</tspan><tspan baseline-shift="super" font-size="11">B</tspan>, R<tspan baseline-shift="sub" font-size="11">WB</tspan>, r<tspan baseline-shift="sub" font-size="11">COM</tspan><tspan baseline-shift="super" font-size="11">B</tspan></text>

  <!-- allocator -->
  <rect x="550" y="180" width="240" height="165" class="box"/>
  <text x="670" y="210" text-anchor="middle" class="head">有界支持力分配</text>
  <text x="670" y="243" text-anchor="middle" class="smallmath">min ‖W<tspan baseline-shift="sub" font-size="11">A</tspan>(𝒜f−w*)‖²<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="670" y="273" text-anchor="middle" class="smallmath">+ ε<tspan baseline-shift="sub" font-size="11">A</tspan>‖f−f<tspan baseline-shift="sub" font-size="11">0</tspan>‖²<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <line x1="582" y1="291" x2="758" y2="291" class="rule"/>
  <text x="670" y="320" text-anchor="middle" class="smallmath">f<tspan baseline-shift="sub" font-size="11">i,min</tspan>≤f<tspan baseline-shift="sub" font-size="11">i</tspan>≤f<tspan baseline-shift="sub" font-size="11">i,max</tspan></text>
  <path d="M470 256H550" class="flow"/>
  <path d="M505 410H530V318H550" class="flow"/>

  <!-- J transpose and actuator -->
  <rect x="845" y="180" width="180" height="165" class="box"/>
  <text x="935" y="210" text-anchor="middle" class="head">解析力矩映射</text>
  <text x="935" y="252" text-anchor="middle" class="math">τ<tspan baseline-shift="sub" font-size="12">i</tspan>=−J<tspan baseline-shift="sub" font-size="12">E,i</tspan>ᵀF<tspan baseline-shift="sub" font-size="12">i</tspan></text>
  <text x="935" y="292" text-anchor="middle" class="smallmath">τ<tspan baseline-shift="sub" font-size="11">i</tspan>=−f<tspan baseline-shift="sub" font-size="11">i</tspan>(e<tspan baseline-shift="sub" font-size="11">z</tspan><tspan baseline-shift="super" font-size="11">W</tspan>)ᵀR<tspan baseline-shift="sub" font-size="11">WB</tspan>R<tspan baseline-shift="sub" font-size="11">BL</tspan>j<tspan baseline-shift="sub" font-size="11">i</tspan><tspan baseline-shift="super" font-size="11">L</tspan></text>
  <text x="935" y="322" text-anchor="middle" class="note">虚功与静力平衡</text>
  <path d="M790 262H845" class="flow"/>

  <rect x="1080" y="205" width="115" height="115" class="box"/>
  <text x="1138" y="235" text-anchor="middle" class="head">限幅</text>
  <text x="1138" y="271" text-anchor="middle" class="smallmath">|τ<tspan baseline-shift="sub" font-size="11">i</tspan>|≤τ<tspan baseline-shift="sub" font-size="11">max</tspan></text>
  <text x="1138" y="299" text-anchor="middle" class="note">逐腿执行</text>
  <path d="M1025 262H1080" class="flow"/>

  <rect x="1240" y="180" width="80" height="165" class="box"/>
  <text x="1280" y="239" text-anchor="middle" class="head">机器人</text>
  <text x="1280" y="272" text-anchor="middle" class="note">闭环腿</text>
  <text x="1280" y="298" text-anchor="middle" class="note">轮地接触</text>
  <path d="M1195 262H1240" class="flow"/>

  <!-- wheel-speed loop -->
  <rect x="550" y="505" width="240" height="88" class="box"/>
  <text x="670" y="534" text-anchor="middle" class="head">可选轮速 PI</text>
  <text x="670" y="566" text-anchor="middle" class="smallmath">v<tspan baseline-shift="sub" font-size="11">x</tspan>*,ω<tspan baseline-shift="sub" font-size="11">yaw</tspan>* → ω<tspan baseline-shift="sub" font-size="11">i</tspan>* → τ<tspan baseline-shift="sub" font-size="11">w,i</tspan></text>
  <path d="M790 549H1220V315H1240" class="flow"/>

  <!-- feedback -->
  <path d="M1280 345V630H132V465" class="feedback"/>
  <path d="M402 630V465" class="feedback"/>
  <text x="657" y="657" text-anchor="middle" class="note">状态反馈：底盘位姿与速度、IMU、四个髋角与角速度、轮心位置、整车质心</text>
</svg>
